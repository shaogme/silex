[workspace]
members = [
    "crates/silex",
    "crates/silex_macros",
    "crates/silex_core",
    "crates/silex_html",
    "crates/silex_css",
    "crates/silex_dom",
    "crates/silex_rx",
    "crates/silex_reactivity",
    "crates/silex_router",
    "crates/silex_persist",
    "crates/silex_net",
    "crates/silex_i18n",
    "crates/utils/silex_hash",
    "crates/utils/silex_vtable",
    "crates/utils/silex_tw_core",
    "examples/counter",
    "examples/store_demo",
    "examples/error_boundary_demo",
    "examples/router",
    "examples/showcase",
    "examples/tailwind",
    "examples/ui",
    "crates/utils/silex_codegen",
    "crates/tests/renamed_dep",
]
exclude = [
    "docs",
    "assets",
    "dist",
]
resolver = "3"

[workspace.lints.rust]
warnings = "deny"

[workspace.package]
version = "0.1.0-beta.9"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Shao G. <shaog.me@gmail.com>"]
repository = "https://github.com/shaogme/silex"
description = "Next Generation High-Performance Rust Web Framework based on fine-grained reactivity and no-virtual-DOM architecture."
readme = "README.md"
homepage = "https://github.com/shaogme/silex"
documentation = "https://docs.rs/silex"
keywords = ["web", "framework", "wasm", "reactive", "gui"]
categories = ["web-programming", "wasm", "gui"]

[workspace.dependencies]

# Internal Crates
silex = { path = "crates/silex", version = "0.1.0-beta.9" }
silex_core = { path = "crates/silex_core", version = "0.1.0-beta.9" }
silex_dom = { path = "crates/silex_dom", version = "0.1.0-beta.9" }
silex_html = { path = "crates/silex_html", version = "0.1.0-beta.9" }
silex_css = { path = "crates/silex_css", version = "0.1.0-beta.9" }
silex_macros = { path = "crates/silex_macros", version = "0.1.0-beta.9", default-features = false }
silex_reactivity = { path = "crates/silex_reactivity", version = "0.1.0-beta.9" }
silex_router = { path = "crates/silex_router", version = "0.1.0-beta.9" }
silex_hash = { path = "crates/utils/silex_hash", version = "0.1.0-beta.9" }
silex_rx = { path = "crates/silex_rx", version = "0.1.0-beta.9" }
silex_persist = { path = "crates/silex_persist", version = "0.1.0-beta.9" }
silex_net = { path = "crates/silex_net", version = "0.1.0-beta.9" }
silex_i18n = { path = "crates/silex_i18n", version = "0.1.0-beta.9" }
silex_vtable = { path = "crates/utils/silex_vtable", version = "0.1.0-beta.9" }
silex_tw_core = { path = "crates/utils/silex_tw_core", version = "0.1.0-beta.9" }

wasm-bindgen = { version = "0.2", default-features = false }
web-sys = { version = "0.3", default-features = false }
js-sys = { version = "0.3", default-features = false }
wasm-bindgen-futures = { version = "0.4.68", default-features = false }
wasm-bindgen-test = "0.3"
gloo-timers = { version = "0.4", default-features = false, features = ["futures"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1.3"
smallvec = "1.13"

proc-macro-crate = "3.4"
syn = { version = "2.0", default-features = false }
quote = { version = "1.0", default-features = false }
proc-macro2 = { version = "1.0", default-features = false }

criterion = "0.7"

[profile.dev]
panic = "unwind"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "unwind"
