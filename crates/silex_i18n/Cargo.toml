[package]
name = "silex_i18n"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[lints]
workspace = true

[dependencies]
silex_core = { workspace = true, features = ["error-i18n"] }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
silex_persist = { workspace = true, optional = true }
silex_i18n_macros = { workspace = true, optional = true }
silex_dom = { workspace = true, optional = true }
silex_router = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = [
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "History",
    "Location",
    "Navigator",
    "Storage",
    "StorageEvent",
    "UrlSearchParams",
    "Window",
] }

[features]
default = []
json = ["dep:serde", "dep:serde_json"]
persist = ["dep:silex_persist", "silex_core/error-i18n-persistence"]
browser = ["dep:js-sys", "dep:wasm-bindgen", "dep:web-sys"]
intl = ["browser", "silex_core/error-intl"]
macros = ["dep:silex_i18n_macros"]
browser-tests = ["browser", "persist", "dep:silex_dom", "dep:silex_router"]

[dev-dependencies]
gloo-timers.workspace = true
trybuild = "1.0"
wasm-bindgen-test.workspace = true
ref_str = "0.2"
silex_core = { workspace = true, features = ["test-support"] }
