[package]
name = "silex"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[lints]
workspace = true

[dependencies]
silex_core.workspace = true
silex_dom.workspace = true
silex_bootstrap = {
    workspace = true,
    optional = true,
    default-features = false,
}
silex_html.workspace = true
silex_css.workspace = true
silex_router.workspace = true
silex_macros = { workspace = true, default-features = false, features = ["component", "store", "route"]}
silex_hash.workspace = true
silex_persist = { workspace = true, optional = true }
silex_net = { workspace = true, optional = true }
silex_i18n = { workspace = true, optional = true }
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = [
    "History",
    "HtmlElement",
    "Node",
    "NodeList",
    "Range",
    "Selection",
    "UrlSearchParams"
] }
js-sys.workspace = true
wasm-bindgen-futures.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
ref_str = "0.2"

[features]
default = ["css", "tw"]
css = ["silex_macros/css"]
tw = ["css", "silex_macros/tw", "silex_css/tw"]
persistence = ["dep:silex_persist", "silex_net/persist", "silex_core/error-persistence"]
json = ["dep:serde", "dep:serde_json", "silex_persist/json", "silex_net/json"]
net = ["dep:silex_net", "silex_core/error-net"]
i18n = ["dep:silex_i18n", "silex_core/error-i18n"]
i18n-json = ["i18n", "silex_i18n/json"]
i18n-persist = [
    "i18n",
    "persistence",
    "silex_i18n/persist",
    "silex_core/error-i18n-persistence",
]
i18n-browser = ["i18n", "silex_i18n/browser"]
i18n-intl = ["i18n", "silex_i18n/intl", "silex_core/error-intl"]
i18n-macros = ["i18n", "silex_i18n/macros"]
bootstrap = ["dep:silex_bootstrap", "silex_bootstrap/all", "silex_core/error-bootstrap"]

[dev-dependencies]
trybuild = "1.0"
wasm-bindgen-test.workspace = true
