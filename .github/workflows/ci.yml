name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@main

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          # Optional: shared-key to share cache between jobs/branches if needed, 
          # but default behavior is usually sufficient (keys on Cargo.lock).
          cache-on-failure: true

      - name: Check Workspace
        run: cargo check --workspace

      - name: Run Tests
        run: cargo test --workspace

      - name: Run Reactivity Test-Support Tests
        run: cargo test -p silex_reactivity --features test-support --all-targets

      - name: Run Documentation Examples
        run: cargo test -p silex_reactivity --test docs_examples

      - name: Run Core Documentation Examples
        run: cargo test -p silex_core --test docs_examples

      - name: Check Reactivity Benchmarks
        run: cargo bench -p silex_reactivity --bench reactivity --no-run

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  miri:
    name: Miri (UB detection)
    runs-on: ubuntu-latest
    env:
      # 严格 provenance：把“指针 → 整数 → 指针”往返也当作错误。
      # 类型擦除容器是本仓库 unsafe 代码的核心，这类往返正是它最容易出的问题。
      MIRIFLAGS: -Zmiri-strict-provenance
      # 本任务钉在滚动的 nightly 上，lint 集合会随之变化。
      # 这里只负责检测未定义行为，lint 由 stable 上的 clippy / test 任务把关，
      # 避免 nightly 新增的 lint 让 UB 检测任务无端变红。
      RUSTFLAGS: --cap-lints=warn
    steps:
      - uses: actions/checkout@main

      - name: Install Nightly Toolchain with Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: miri
          cache-on-failure: true

      # 只跑可在 Miri 下执行的底层 crate；依赖 wasm-bindgen 的 core/DOM 路径由普通测试覆盖。
      - name: Run Miri
        run: cargo miri test -p silex_reactivity -p silex_vtable

      - name: Run Reactivity Miri Test-Support Tests
        run: cargo miri test -p silex_reactivity --features test-support

  ci-success:
    name: CI Success
    needs: [test, fmt, clippy, miri]
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - name: Success
        run: echo "All tests passed"
