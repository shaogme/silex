[package]
name = "line-lint"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
ignore = "0.4"
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"

[lints.rust]
warnings = "deny"

[dev-dependencies]
tempfile = "3.23"
