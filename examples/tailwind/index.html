<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Silex Tailwind Utility-First CSS Demo</title>
</head>

<body style="margin: 0; padding: 0; background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;">
    <div id="app"></div>

    <script type="module">
        let tailwindHost = null;

        window.addEventListener("TrunkApplicationStarted", () => {
            if (tailwindHost !== null) return;
            try {
                tailwindHost = window.wasmBindings.mountTailwind();
            } catch (error) {
                console.error("Tailwind showcase mount failed", error);
            }
        });

        window.addEventListener("tailwind-unmount", () => {
            if (tailwindHost === null) return;
            try {
                tailwindHost.unmount();
            } catch (error) {
                console.error("Tailwind showcase unmount failed", error);
            }
        });
    </script>
</body>

</html>
